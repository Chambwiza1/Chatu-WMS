# nginx + PHP-FPM example for a Linux server. Adjust server_name, paths and the PHP socket.
server {
    listen 80;
    server_name wms.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wms.example.com;

    ssl_certificate     /etc/letsencrypt/live/wms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wms.example.com/privkey.pem;

    # the document root is the public folder only
    root /var/www/chatuwarehouse/public;
    index index.php;
    client_max_body_size 10m;

    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; try_files $uri =404; }
    location /static/ { expires 7d; try_files $uri =404; }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\. { deny all; }
}
