# Apache virtual host example for a Linux server (mod_php or PHP-FPM).
<VirtualHost *:443>
    ServerName wms.example.com
    DocumentRoot /var/www/chatuwarehouse/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/wms.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/wms.example.com/privkey.pem

    <Directory /var/www/chatuwarehouse/public>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
<VirtualHost *:80>
    ServerName wms.example.com
    Redirect permanent / https://wms.example.com/
</VirtualHost>
